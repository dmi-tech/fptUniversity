# OpenOCD configuration that only READS the RTT log of the STM32H573 over
# ST-LINK. It does not reset or halt the target, and it cannot flash (OpenOCD
# 0.12 has no STM32H5 flash driver; use scripts/flash.sh).
#
# Needs ST-LINK firmware V2J24 or newer. Log is served on TCP port 19021.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set CHIPNAME stm32h573
source [find target/stm32h5x.cfg]

init
# RTT control block is searched in the first 256 KiB of SRAM
rtt setup 0x20000000 0x40000 "SEGGER RTT"
rtt start
rtt server start 19021 0
