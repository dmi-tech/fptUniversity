# --- Log qua SEGGER RTT (đọc bằng scripts/rtt.sh) ---
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# Không dùng UART làm console (UART5 dành riêng cho log của MCUboot)
CONFIG_UART_CONSOLE=n
# Giữ SWD truy cập được khi CPU ngủ (WFI), nếu không RTT/nạp sẽ mất kết nối
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# --- Bắt buộc khi chạy sau MCUboot ---
CONFIG_BOOTLOADER_MCUBOOT=y

