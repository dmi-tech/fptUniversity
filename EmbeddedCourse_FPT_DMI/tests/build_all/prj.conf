# Base Kconfig for every build_all configuration (same as the student prj.conf).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
# Drivers handle the missing options themselves; these three are always present.
CONFIG_GPIO=y
# Kconfig the protocol drivers need (see their READMEs); build_all links every driver.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# Kconfig of the devices and the MQTT service (see their READMEs)
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_RTC=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_ETH_W5500=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MQTT_LIB=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_POLL_MAX=6
CONFIG_POSIX_API=y
