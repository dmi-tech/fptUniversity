# fw_showcase 3.1.0 — DHT11 + LCD + web/MQTT + alarm (RS485, relay, motor)
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_STDOUT_CONSOLE=y

# Console over SEGGER RTT (read through the SWD probe, no UART adapter):
# printk and the log both go to RTT channel 0. UART5 stays free.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
# Keep SWD reachable while the idle thread sits in WFI
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
CONFIG_GPIO=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_REBOOT=y

# DHT11 (PC2). The bit timing is decoded by busy polling, keep IRQs from
# stretching the measured pulses.
CONFIG_SENSOR=y
CONFIG_DHT=y
CONFIG_DHT_LOCK_IRQS=y

# 20x4 LCD (PCF8574 on I2C1)
CONFIG_I2C=y

# RS485 (UART4): polled TX, interrupt-driven RX for ON/OFF commands
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# W5500 Ethernet
CONFIG_SPI=y
CONFIG_ETH_W5500=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
# IP is assigned at runtime in main.c (DHCP or static per web config).
# net_config auto-init + compile-time static are disabled so they don't
# force 192.168.1.100 before the DHCP client can request a lease.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_POSIX_API=y

# Thread / memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZVFS_POLL_MAX=6
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=12

CONFIG_HEAP_MEM_POOL_SIZE=16384

# ── MQTT client + DNS ──
CONFIG_MQTT_LIB=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

# ── TLS for MQTT (port 8883, broker certificate verified against ISRG Root X1) ──
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=10000
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
# 16 KB input records; the output buffer is reduced to 2 KB in
# src/modules/MQTT/TLS/mbedtls_user_config.h
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_user_config.h"
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_PSA_WANT_ALG_SHA_384=y
