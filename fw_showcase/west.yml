# west manifest for fw_showcase.
#
#   west init -l --mf fw_showcase/west.yml fptUniversity
#   (run from the directory that holds the fptUniversity clone)
#   west update
#
# Only the modules this firmware needs are fetched.
manifest:
  version: "1.2"

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_stm32
          - mbedtls
          - mcuboot
          - picolibc
          - segger
          - tf-psa-crypto
          - zcbor

  self:
    path: fptUniversity
