name: self-hosted-runner-test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/self-hosted-test

jobs:
  verify-runner:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Show runner info
        run: |
          echo "Hostname      : $(hostname)"
          echo "Runner name   : ${RUNNER_NAME:-n/a}"
          echo "Runner OS     : ${RUNNER_OS:-n/a} / ${RUNNER_ARCH:-n/a}"
          echo "Working dir   : $(pwd)"
          echo "Date          : $(date)"
          echo "Kernel        : $(uname -a)"
